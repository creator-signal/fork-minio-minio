name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        # Declarative BrowserRouter does not expose the advisory's RSC action
        # path. The fork audit rejects this exception if RSC code is introduced.
        with:
          allow-ghsas: GHSA-qwww-vcr4-c8h2
